name: Deploy Preview & Production Check

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-verification:
    name: Deployment Build & Artifact Verification
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.26.2
          run_install: false

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Next.js Application
        run: pnpm build
        env:
          NEXT_PUBLIC_APP_ENV: production
          NEXT_PUBLIC_API_MODE: mock
          NEXT_PUBLIC_APP_URL: https://whatsapp-crm.mindclub.internal

      - name: Verify Build Artifacts
        run: |
          test -d .next || exit 1
          echo "Build completed successfully. Artifacts verified."
